spring.application.name=crediandes-solicitudes
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:mem:crediandes;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:crediandes_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
