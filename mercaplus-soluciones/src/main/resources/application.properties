spring.application.name=mercaplus
server.port=8080

# Lab 4: credenciales fuera del codigo (en AWS: Secrets Manager -> variables de entorno de la tarea ECS)
spring.datasource.url=${DB_URL:jdbc:h2:mem:mercaplus;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:mercaplus_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Lab 4: consola H2 apagada y actuator minimo
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info

pagaya.api-key=${PAGAYA_API_KEY:solo-desarrollo-local}
pagaya.limite-aprobacion=5000000

# Lab 7: carrito en Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
