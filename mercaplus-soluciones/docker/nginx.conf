events {}

http {
    # Docker resuelve "app" a todas las replicas; NGINX reparte en round robin.
    resolver 127.0.0.11 valid=10s;

    upstream mercaplus {
        server app:8080;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://mercaplus;
            proxy_set_header Host $host;
            add_header X-Balanceador nginx;
        }
    }
}
