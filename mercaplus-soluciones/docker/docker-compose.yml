# SOLUCION LAB 7 - 3 replicas sin estado + NGINX + Redis
# docker compose -f docker/docker-compose.yml up --build --scale app=3
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      PAGAYA_API_KEY: ${PAGAYA_API_KEY:-solo-desarrollo-local}
    depends_on:
      - redis

  balanceador:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  redis:
    image: redis:7-alpine
