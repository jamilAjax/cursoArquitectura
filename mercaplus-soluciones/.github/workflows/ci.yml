# SOLUCION LAB 5 - Pipeline DevSecOps con fitness functions
name: ci

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, pruebas y umbral de cobertura (JaCoCo >= 80 % en codigo nuevo)
        run: mvn -B verify

      - name: Fitness function - reglas hexagonales (ArchUnit)
        run: mvn -B test -Parquitectura -Dtest=ReglasHexagonalesTest

      - name: SCA - dependencias vulnerables
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  imagen:
    needs: construir-y-probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -f docker/Dockerfile -t mercaplus:${{ github.sha }} .

      - name: Escanear imagen
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mercaplus:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # GitOps (demostracion): en main se publica la imagen en Amazon ECR y se actualiza el tag
      # en el repositorio de manifiestos; Argo CD (o el despliegue de ECS) reconcilia el cambio.
      # Requiere: rol OIDC de AWS (sin llaves en el repo) y el repo "mercaplus-gitops".
