# Requisito del reto: al menos 2 replicas sin estado detras de un balanceador.
# docker compose -f docker/docker-compose.yml up --build --scale app=2
# Nombre de proyecto fijo: evita choques de imagenes con otros compose que esten en una carpeta docker/
name: crediandes

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "8080"
    # TODO: variables de entorno (sin secretos en este archivo; usar un .env fuera del repo)

  balanceador:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
  # TODO: base de datos compartida (PostgreSQL) si las replicas deben ver las mismas solicitudes
